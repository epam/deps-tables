[tool.poetry]
name = "deps-tables"
version = "0.1.1"
description = "Table Detection and extraction service"
authors = ["Aliaksei Yurkevich <Aliaksei_Yurkevich@epam.com>"]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
python = "~3.12"
torch = { version = "2.2.2+cpu", source = "pytorch-cpu" }
torchvision = { version = "0.17.2+cpu", source = "pytorch-cpu" }
detectron2 = { url = "https://github.com/MiroPsota/torch_packages_builder/releases/download/detectron2-0.6%2B18f6958/detectron2-0.6%2B18f6958pt2.2.2cpu-cp312-cp312-linux_x86_64.whl" }
pydantic = "^1.7.3"
numpy = "^1.25.2"
boto3 = "^1.16.58"
textract-trp = "^0.1.3"
Pillow = "^10.4"
scikit-learn = "^1.5"
opencv-python-headless = "~4.6"
grpcio = "^1.62"
fastapi = "~0.109.2"
dependency-injector = "^4.23.1"
python-multipart = "^0.0.5"
gunicorn = "^20.0.4"
uvicorn = "^0.32.0"
uvloop = "^0.21"
httptools = "^0.6"
sentry-sdk = "^1.1.0"
azure-ai-formrecognizer = "~3.3.0"
deps-message-flow = { path = "../vendors/deps-message-flow/src", extras = ["deps-asb", "deps-kafka", "deps-rabbitmq"], develop = true }
typing-extensions = "^4.8.0"
google-cloud = "^0.34.0"
google-cloud-documentai = "^2.15.0"
more-itertools = "^9.1.0"
Authlib = "^0.15.3"

[tool.poetry.group.dev.dependencies]
mypy = "^1.5.1"
types-requests = "^2.32"
types-mock = "^5.1"
flake8 = "~7.0.0"
isort = "~5.12.0"
black = "^24.1"
pytest = "~7.4.0"
coverage = "^7.6"
pytest-mock = "^3.11.1"
factory-boy = "^3.3.0"
mock = "^5.1.0"
requests-mock = "~1.11.0"
wemake-python-styleguide = "~0.19.2"
bandit = "~1.7.5"
ipdb = "^0.13.11"
wdb = "^3.3.0"
pytest-factoryboy = "2.5.1"
httpx = "^0.27.0"
setuptools = "^68.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 130
target-version = ['py312']
exclude = '''
(
    .venv
    | vendors
    | etc
)
'''

